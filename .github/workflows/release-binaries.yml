name: Gas Station Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: []
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build:
          - binary_name: x86_64-linux
            target: x86_64-unknown-linux-gnu
          - binary_name: "arm64-linux"
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout infra repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binaries (${{ matrix.build.binary_name }})
        working-directory: gas-station-src
        run: |
          cross build --locked --all-features --release --target ${{ matrix.build.target }}

      - name: Package artifacts
        run: |
          mkdir -p artifacts/${{ matrix.build.binary_name }}
          cp target/${{ matrix.build.target }}/release/iota-gas-station artifacts/iota-gas-station-${{ matrix.build.binary_name }}
          cp target/${{ matrix.build.target }}/release/tool artifacts/tool-${{ matrix.build.binary_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gas-station-${{ matrix.build.binary_name }}
          path: artifacts

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**/*
